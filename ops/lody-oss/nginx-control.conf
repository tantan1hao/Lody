server {
    listen 127.0.0.1:18080;
    server_name _;
    root /srv/lody-oss/web;

    # The self-hosted renderer is a public-code bundle but still travels over
    # the private tailnet. Compress it aggressively so high-latency links do
    # not have to transfer the 10+ MB JavaScript entry uncompressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css text/javascript;

    location = /.well-known/lody-oss.json {
        alias /etc/lody-oss/config.json;
        default_type application/json;
        # Electron loads this bootstrap document from a file:// renderer. The
        # control host is still reachable only inside the tailnet.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ds/ {
        client_max_body_size 64m;
        # Browser/Electron clients use the same Streams endpoint. Reflect the
        # preflight header list because Streams protocol extensions add several
        # versioned Stream-* and Producer-* request headers.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Max-Age "86400" always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Type, Producer-Epoch, Producer-Expected-Seq, Producer-Received-Seq, Producer-Seq, Stream-CAS-Mismatch, Stream-Closed, Stream-Cursor, Stream-Expected-Offset, Stream-Expires-At, Stream-Extensions, Stream-Next-Offset, Stream-SSE-Data-Encoding, Stream-Snapshot-Offset, Stream-TTL, Stream-Up-To-Date" always;
        # Preserve the /ds/ prefix. Loro Streams owns that path; a trailing
        # slash here would rewrite /ds/<bucket>/<stream> to /<bucket>/<stream>.
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
