server {
    listen 127.0.0.1:18080;
    server_name _;
    root /srv/lody-oss/web;

    location = /.well-known/lody-oss.json {
        alias /etc/lody-oss/config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ds/ {
        # Preserve the /ds/ prefix. Loro Streams owns that path; a trailing
        # slash here would rewrite /ds/<bucket>/<stream> to /<bucket>/<stream>.
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
