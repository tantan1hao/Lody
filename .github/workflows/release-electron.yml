name: Release Lody OSS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, e.g. 0.89.0'
        required: false
        default: '0.89.0'
        type: string
      publish:
        description: 'Publish to GitHub Releases and tan'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-lody-oss-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  LODY_OSS_CONTROL_URL: ${{ vars.LODY_OSS_CONTROL_URL }}
  LODY_OSS_UPDATE_URL: ${{ vars.LODY_OSS_UPDATE_URL }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            package_args: '--mac --arm64'
          - os: windows-2022
            target: win
            package_args: '--win --x64'
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_msvs_version: ${{ matrix.target == 'win' && '2022' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Resolve and validate release settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}"
            exit 1
          fi
          for value in LODY_OSS_CONTROL_URL LODY_OSS_UPDATE_URL; do
            if [[ -z "${!value:-}" || "${!value}" != https://* ]]; then
              echo "Set repository variable ${value} to an HTTPS URL"
              exit 1
            fi
          done
          echo "LODY_OSS_RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundled CLI and self-hosted renderer
        run: pnpm --dir apps/electron run build

      - name: Package ${{ matrix.target }}
        run: pnpm --dir apps/electron run package -- ${{ matrix.package_args }} --publish never

      - name: Collect exact release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "${{ matrix.target }}" == "mac" ]]; then
            artifact="apps/electron/dist/LodyOSS-${LODY_OSS_RELEASE_VERSION}-arm64.dmg"
            test -s "${artifact}"
            cp "${artifact}" release-assets/
            if find apps/electron/dist -maxdepth 1 -type f \( -name '*.zip' -o -name 'latest-mac.yml' \) | grep -q .; then
              echo 'Unsigned macOS job produced forbidden Squirrel metadata'
              exit 1
            fi
          else
            installer="apps/electron/dist/LodyOSS-${LODY_OSS_RELEASE_VERSION}-x64-setup.exe"
            test -s "${installer}"
            test -s "${installer}.blockmap"
            test -s apps/electron/dist/latest.yml
            cp "${installer}" "${installer}.blockmap" apps/electron/dist/latest.yml release-assets/
          fi
          ls -la release-assets

      - name: Upload desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: lody-oss-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web OSS
        run: pnpm --filter @lody/web-oss build
      - name: Upload Web OSS
        uses: actions/upload-artifact@v4
        with:
          name: lody-oss-web
          path: apps/web-oss/dist/**
          if-no-files-found: error

  publish:
    needs: [desktop, web]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
          fi
          echo "LODY_OSS_RELEASE_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Download macOS asset
        uses: actions/download-artifact@v4
        with:
          name: lody-oss-mac
          path: release-assets

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: lody-oss-win
          path: release-assets

      - name: Build and verify release.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-lody-oss-release-manifest.mjs \
            --dir=release-assets \
            --version="${LODY_OSS_RELEASE_VERSION}" \
            --base-url="${LODY_OSS_UPDATE_URL}"
          node -e "JSON.parse(require('node:fs').readFileSync('release-assets/release.json', 'utf8'))"
          sha512sum release-assets/*

      - name: Publish GitHub mirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${LODY_OSS_RELEASE_VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* \
              --title "Lody OSS ${LODY_OSS_RELEASE_VERSION}" \
              --generate-notes
          fi

      - name: Configure restricted tan release SSH key
        shell: bash
        env:
          TAN_RELEASE_SSH_KEY: ${{ secrets.TAN_RELEASE_SSH_KEY }}
          TAN_RELEASE_HOST_KEY: ${{ secrets.TAN_RELEASE_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${TAN_RELEASE_SSH_KEY}" > ~/.ssh/lodyrelease
          chmod 600 ~/.ssh/lodyrelease
          printf '%s\n' "${TAN_RELEASE_HOST_KEY}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload immutable artifacts, then mutable metadata
        shell: bash
        run: |
          set -euo pipefail
          ssh_transport='ssh -i ~/.ssh/lodyrelease -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          # The authorized key is forced through rrsync rooted at the release directory.
          target='lodyrelease@47.90.224.36:/'
          rsync -av -e "${ssh_transport}" release-assets/LodyOSS-* "${target}"
          rsync -av -e "${ssh_transport}" release-assets/latest.yml "${target}"
          # rsync writes a temporary file and renames it at completion, so this last transfer is
          # the atomic publication point without granting the CI key a general remote shell.
          rsync -av -e "${ssh_transport}" release-assets/release.json "${target}"

      - name: Verify public feed
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${LODY_OSS_UPDATE_URL%/}/release.json" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v.version!==process.env.LODY_OSS_RELEASE_VERSION)process.exit(1)})"
          curl --fail --silent --show-error --range 0-0 \
            "${LODY_OSS_UPDATE_URL%/}/LodyOSS-${LODY_OSS_RELEASE_VERSION}-arm64.dmg" >/dev/null
          curl --fail --silent --show-error --range 0-0 \
            "${LODY_OSS_UPDATE_URL%/}/LodyOSS-${LODY_OSS_RELEASE_VERSION}-x64-setup.exe" >/dev/null
